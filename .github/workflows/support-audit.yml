name: Supplemental base integration audit
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kl5-support-audit
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
jobs:
  support:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Free disk before read-only base analysis
        run: bash scripts/free_disk.sh
      - name: Install transfer dependency
        run: python3 -m pip install --disable-pip-version-check 'requests==2.32.4'
      - name: Audit GSI integration scripts and APEX containers
        timeout-minutes: 25
        run: python3 scripts/support_audit.py
