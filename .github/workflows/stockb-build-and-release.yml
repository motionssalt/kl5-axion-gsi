name: stockb-build-and-release

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Which package to build and release'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - stock
          - gsi

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h

      - name: Install System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils curl jq unzip xz-utils python3-requests

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build and Publish Releases
        env:
          GH_PAT_SECRET: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use GH_PAT if provided in repository secrets, otherwise use GITHUB_TOKEN
          AUTH_TOKEN="${GH_PAT_SECRET:-$GITHUB_TOKEN}"
          python3 scripts/build_and_publish.py --token "$AUTH_TOKEN" --step "${{ github.event.inputs.step || 'all' }}"
