name: Pipeline safety checks
on:
  push:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/**
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/**
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Standard-library tests and compilation
        run: |
          python3 -m pip install --disable-pip-version-check 'requests==2.32.4'
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
          bash -n scripts/free_disk.sh scripts/apply_patches.sh
          sh -n scripts/collect_device.sh
      - name: Validate workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -shellcheck=''
