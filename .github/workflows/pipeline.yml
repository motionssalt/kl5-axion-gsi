name: KL5 compatibility pipeline
on:
  workflow_dispatch:
    inputs:
      continuation_count:
        description: Internal bounded continuation counter
        type: string
        default: '0'
      stock_asset_url:
        description: Optional direct Release asset URL for stock import
        type: string
        default: ''
      base_url:
        description: Optional new vanilla arm64 AxionOS .img.xz Release URL
        type: string
        default: ''
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: kl5-pipeline
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_PAT || github.token }}
      - name: Git identity
        run: |
          git config user.name 'MOTIONSALT Pipeline'
          git config user.email 'motionssalt@users.noreply.github.com'
      - name: Free disk before the first heavy stage
        run: bash scripts/free_disk.sh
      - name: Install transfer helpers
        run: python3 -m pip install --disable-pip-version-check 'requests==2.32.4' 'gdown==5.2.0'
      - name: Mirror stock FIRST
        id: stock
        timeout-minutes: 250
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_URL: ${{ inputs.stock_asset_url }}
        run: python3 scripts/mirror.py stock --url "$INPUT_URL"
      - name: Recover complete stock chunks before teardown
        if: always() && !cancelled()
        timeout-minutes: 25
        run: python3 scripts/save_partial.py
      - name: Mirror base independently
        if: always() && !cancelled()
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_URL: ${{ inputs.base_url }}
        run: python3 scripts/mirror.py base --url "$INPUT_URL"
      - name: Check input job persistence
        if: always()
        run: python3 scripts/job_status.py inputs
  audit-build:
    needs: inputs
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_PAT || github.token }}
      - name: Git identity
        run: |
          git config user.name 'MOTIONSALT Pipeline'
          git config user.email 'motionssalt@users.noreply.github.com'
      - name: Free disk
        run: bash scripts/free_disk.sh
      - name: Install prebuilt image tools (never build Android)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends erofs-utils e2fsprogs attr android-sdk-libsparse-utils binutils aapt
          python3 -m pip install --disable-pip-version-check 'requests==2.32.4'
          sudo modprobe erofs || true
      - name: Validate pipeline code
        run: python3 -m unittest discover -s tests -v
      - name: Audit base without stock dependency
        timeout-minutes: 65
        run: python3 scripts/runner.py base-audit
      - name: Audit stock selectively
        timeout-minutes: 155
        run: python3 scripts/runner.py stock-audit
      - name: Publish ranked gaps
        if: always() && !cancelled()
        timeout-minutes: 20
        run: python3 scripts/runner.py summary
      - name: Design evidence-backed patches and optional manual OTG module
        if: always() && !cancelled()
        timeout-minutes: 15
        run: python3 scripts/runner.py design
      - name: Apply patches and verify filesystem
        if: always() && !cancelled()
        timeout-minutes: 55
        run: python3 scripts/runner.py build
      - name: Persist job status
        if: always()
        run: python3 scripts/job_status.py audit-build
  emulator:
    needs: audit-build
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_PAT || github.token }}
      - name: Git identity
        run: |
          git config user.name 'MOTIONSALT Pipeline'
          git config user.email 'motionssalt@users.noreply.github.com'
      - name: Free disk
        run: bash scripts/free_disk.sh
      - name: Resolve matching Android 16 ARM64 emulator pins before heavy setup
        id: pins
        timeout-minutes: 35
        run: |
          python3 -m pip install --disable-pip-version-check 'requests==2.32.4'
          python3 scripts/emulator_preflight.py
      - name: Install Cuttlefish host prerequisites from official signed repository
        if: steps.pins.outputs.ready == 'true'
        timeout-minutes: 20
        run: |
          python3 -m pip install --disable-pip-version-check 'requests==2.32.4'
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends curl ca-certificates qemu-system-arm libpulse0 libpulse-mainloop-glib0 libslirp0 libvirglrenderer1 libepoxy0 libgl1 libglx-mesa0 libgl1-mesa-dri || true
          sudo curl -fsSL https://us-apt.pkg.dev/doc/repo-signing-key.gpg -o /etc/apt/trusted.gpg.d/artifact-registry.asc || true
          sudo chmod a+r /etc/apt/trusted.gpg.d/artifact-registry.asc || true
          echo 'deb https://us-apt.pkg.dev/projects/android-cuttlefish-artifacts android-cuttlefish main' | sudo tee /etc/apt/sources.list.d/artifact-registry.list
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends cuttlefish-base cuttlefish-user || true
          sudo groupadd -f kvm || true
          sudo groupadd -f cvdnetwork || true
          sudo groupadd -f render || true
          sudo usermod -aG kvm,cvdnetwork,render "$USER"
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          sudo udevadm trigger || true
      - name: Real ARM64 base and patched boot tests
        if: always() && !cancelled() && steps.pins.outputs.ready == 'true'
        timeout-minutes: 255
        run: |
          if getent group cvdnetwork >/dev/null 2>&1; then
            sg cvdnetwork -c 'python3 scripts/runner.py emulator'
          else
            python3 scripts/runner.py emulator
          fi
      - name: Persist job status
        if: always()
        run: python3 scripts/job_status.py emulator
  report:
    needs: [inputs, audit-build, emulator]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_PAT || github.token }}
      - name: Git identity and requests
        run: |
          git config user.name 'MOTIONSALT Pipeline'
          git config user.email 'motionssalt@users.noreply.github.com'
          python3 -m pip install --disable-pip-version-check 'requests==2.32.4'
      - name: Publish only a genuine emulator-verified patched build
        run: python3 scripts/finish.py --promote
      - name: Phase 6 AFTER compatibility release gate
        run: python3 scripts/runner.py sandbox
      - name: Final report, notification and bounded continuation
        if: always()
        env:
          CONTINUATION_COUNT: ${{ inputs.continuation_count || '0' }}
          CONTINUE_BASE_URL: ${{ inputs.base_url }}
          CONTINUE_STOCK_URL: ${{ inputs.stock_asset_url }}
          INFRA_FAILED: ${{ contains(needs.*.result, 'failure') }}
        run: python3 scripts/finish.py
